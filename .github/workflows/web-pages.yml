name: WebGL game and GitHub Pages

on:
  push:
    branches: [main]
    paths: ['Web/**', '.github/workflows/web-pages.yml']
  pull_request:
    paths: ['Web/**', '.github/workflows/web-pages.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: web-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: Web
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: Web/package-lock.json
      - name: Install exact dependencies without package lifecycle scripts
        run: npm ci --ignore-scripts
      - name: Dependency advisory audit
        run: npm audit --audit-level=high
      - name: Simulation and protocol checks
        run: npm test
      - name: Install browser test runtime
        run: node node_modules/playwright/cli.js install --with-deps chromium
      - name: Build notices and licenses
        run: node scripts/build-notices.mjs
      - name: Browser, P2P, phone, graphics and production-CSP checks
        run: npm run test:browser -- --reporter=line
      - name: Retain browser diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-diagnostics
          path: Web/test-results
          retention-days: 7
      - name: Verify final static release
        run: npm run release:verify
      - name: Upload checked Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: Web/dist

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
      - name: Deploy verified artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
